name: Test tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  template-access:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run template access tests
        shell: pwsh
        run: ./tests/template-access.ps1

  bastion-vm-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.15"
      - name: Run Linux Bastion VM tests
        run: uv run --locked pytest -q
      - name: Compile the Linux Bastion VM template
        if: runner.os == 'Linux'
        run: az bicep build --file tools/bastion-vm-linux/resources/main.bicep --outdir "${{ runner.temp }}"
